id = "veinminer_autosmelt"
kind = "native-mod"
name = "Veinminer & Autosmelt"
summary = "Mine a whole ore vein at once with the Veinmine enchantment, and smelt raw iron, gold and copper as you mine with Smelting."
description = """
A Horizon port of the **Veinmine & Autosmelt Enchantments** datapack.

**Veinmine** (`veinminer_autosmelt:veinminer`): break one ore with a pickaxe and the whole connected vein goes with it, diagonals included. Regular and deepslate ores count as one vein, and iron, copper and gold continue into their raw blocks. Fortune, Silk Touch and tool wear work as in vanilla, and the drops are gathered at the ore you mined.

**Smelting** (`veinminer_autosmelt:smelting`): raw iron, gold and copper (and their raw blocks) drop as ingots and blocks, with a hiss and a puff of smoke. It combines with Veinmine and Fortune.

- Both enchantments go on pickaxes and can be found at the enchanting table, from librarians, and as books on the creative Ingredients tab.
- Settings are in `config/veinminer_autosmelt-common.toml`: hunger while veinmining, cooldown, a vein size cap, whether the enchantment is required, and a toggle for each pickaxe tier.

Native mod: the launcher compiles it for your game build. Source: https://github.com/rismose/veinminer-horizon
"""
